name: Release

# Builds installable bundles for Linux (deb/rpm/AppImage), macOS (arm64 +
# x64) and Windows, attaches them to a GitHub Release, and auto-publishes it.
# Triggered by a version tag (full release, all platforms) or manually (quick
# debug build — pick only the platforms you need).
#
# Configure once (Settings → Secrets and variables → Actions):
#   NOTIFY_WEBHOOK_URL   (secret)   optional — ntfy.sh topic or a Slack /
#                                   Discord webhook; a completion message is
#                                   POSTed when the run finishes.
#   MANUAL_RELEASE_REVIEW (variable) optional — set to "true" to keep the
#                                   release as a draft for manual review
#                                   instead of auto-publishing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 0.1.2 (used for the release tag)'
        required: true
        type: string
      platforms:
        description: >-
          Runners to build for, comma-separated (quick debug builds).
          Allowed: ubuntu-22.04, macos-latest, macos-13, windows-latest
        required: false
        default: ubuntu-22.04

permissions:
  contents: write

jobs:
  setup:
    name: Resolve matrix + tag
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      tag: ${{ steps.resolve.outputs.tag }}
      release_body: ${{ steps.changelog.outputs.release_body }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute platform matrix and release tag
        id: resolve
        run: |
          ALLOWED='ubuntu-22.04 macos-latest macos-13 windows-latest'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            case "$VERSION" in
              [0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::workflow_dispatch requires a version like 0.1.2"; exit 1 ;;
            esac
            TAG="v$VERSION"
            SELECTED="${{ inputs.platforms }}"
          else
            TAG="${{ github.ref_name }}"
            SELECTED='ubuntu-22.04, macos-latest, macos-13, windows-latest'
          fi

          JSON='['
          IFS=',' read -ra PLATFORMS <<< "$SELECTED"
          for p in "${PLATFORMS[@]}"; do
            p="${p//[[:space:]]/}"
            if [ -z "$p" ]; then continue; fi
            if ! echo "$ALLOWED" | grep -qw "$p"; then
              echo "::error::unknown runner '$p' — allowed: $ALLOWED"
              exit 1
            fi
            [ "$JSON" != '[' ] && JSON+=","
            JSON+="{\"platform\":\"$p\"}"
          done
          JSON+=']'
          if [ "$JSON" = "[]" ]; then
            echo "::error::no platforms selected"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "building tag $TAG on: $JSON"

      # Hard fail if the version baked into the files doesn't match the tag we're
      # building for. This is the drift guard: a repo where someone (or an agent)
      # bumped the tag but not the code — or vice versa — used to produce a release
      # tagged vX that contained Y bundles, silently. Now it fails the run with a
      # clear message before any build happens.
      - name: Verify tag matches app version
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          for f in package.json src-tauri/tauri.conf.json; do
            node -e "const j=JSON.parse(require('fs').readFileSync('$f','utf8')); if(j.version!=='$VERSION'){console.error('$f version '+j.version+' != tag $VERSION'); process.exit(1)}" \
              || { echo "::error::$f version does not match tag $TAG"; exit 1; }
          done
          grep -q "^version = \"$VERSION\"" src-tauri/Cargo.toml \
            || { echo "::error::src-tauri/Cargo.toml version does not match tag $TAG"; exit 1; }
          [ "$(awk '/^name = "pragma"/{f=1} f&&/^version = /{print $3;exit}' src-tauri/Cargo.lock)" = "\"$VERSION\"" ] \
            || { echo "::error::Cargo.lock version does not match tag $TAG"; exit 1; }
          echo "version $VERSION matches package.json, tauri.conf.json, Cargo.toml, Cargo.lock ✓"

      # Release notes = install preamble + THIS version's CHANGELOG.md section
      # (so the changelog is embedded in the notes, not linked). Kept out of
      # tauri-action's releaseBody because it's easier to set it reliably via
      # gh --notes-file once the draft exists.
      - name: Extract changelog for this release
        id: changelog
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          {
            echo "release_body<<CHANGELOG_EOF"
            echo "See the assets below to download and install this version."
            echo ""
            echo "- **Linux**: use the \`.deb\` (Debian/Ubuntu) or \`.AppImage\` (any distro, no install needed)"
            echo "- **macOS**: use the \`.dmg\` / \`.app\` for your architecture (Apple Silicon or Intel)"
            echo "- **Windows**: use the \`.msi\` installer"
            echo ""
            echo "## Changelog"
            echo ""
            while IFS= read -r line; do
              if [[ -z "$in_section" && "$line" == "## [$VERSION]"* ]]; then
                in_section=1
              elif [[ -n "$in_section" && "$line" == "## "* ]]; then
                break
              fi
              if [[ -n "$in_section" ]]; then
                printf '%s\n' "$line"
              fi
            done < CHANGELOG.md
            if [[ -z "$in_section" ]]; then
              echo "_No changelog entry for this version yet._"
            fi
            echo ""
            echo "Full changelog: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  publish-tauri:
    name: Publish (${{ matrix.platform }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      # The Rust toolchain + registry + target dir are the bulk of the build
      # time (tauri/sqlx/reqwest …). Cached across runs on each runner, so a
      # follow-up release builds in a few minutes instead of 15-30.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Export signing env vars ONLY when the matching secret is non-empty.
      # Passing them as empty strings (the default for unset secrets) makes
      # Tauri treat the variable as present — on macOS it then tries to import
      # a non-existent certificate and the bundle step fails (this exact bug
      # bit the first v0.1.3 run). Absent vars = Tauri skips signing.
      - name: Configure signing env
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in \
            TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            CSC_LINK CSC_KEY_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          do
            value=$(printenv "$v" || true)
            if [ -n "$value" ]; then
              echo "$v=$value" >> "$GITHUB_ENV"
            fi
          done
          echo "signing env configured (only non-empty secrets exported)"

      - name: Build bundles and attach to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.setup.outputs.tag }}
          releaseName: 'Pragma v__VERSION__'
          # Generate + upload the updater manifest (latest.json) + per-platform
          # updater artifacts each release, so the app can self-update.
          createUpdaterArtifacts: true
          # The full notes (install preamble + changelog section) are written
          # by the publish job via gh --notes-file once the draft exists.
          releaseDraft: true
          prerelease: false

  publish:
    name: Publish release
    needs: [setup, publish-tauri]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write release notes + publish draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.setup.outputs.tag }}
          RELEASE_BODY: ${{ needs.setup.outputs.release_body }}
          MANUAL_REVIEW: ${{ vars.MANUAL_RELEASE_REVIEW }}
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$RELEASE_BODY" > "$NOTES"
          if [ "$MANUAL_REVIEW" = "true" ]; then
            gh release edit "$TAG" --notes-file "$NOTES"
            echo "MANUAL_RELEASE_REVIEW=true — notes set, release kept as a draft for manual review"
            exit 0
          fi
          if gh release view "$TAG" --json isDraft -q '.isDraft' 2>/dev/null | grep -q true; then
            gh release edit "$TAG" --draft=false --notes-file "$NOTES"
            echo "published release $TAG with changelog"
          else
            gh release edit "$TAG" --notes-file "$NOTES"
            echo "release $TAG already published — notes updated"
          fi

  notify:
    name: Notify build finished
    needs: [setup, publish-tauri, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send completion webhook
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          BUILD_STATUS: ${{ needs.publish-tauri.result }}
          PUBLISH_STATUS: ${{ needs.publish.result }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          if [ -z "$NOTIFY_WEBHOOK_URL" ]; then
            echo "NOTIFY_WEBHOOK_URL not set — skipping notification"
            exit 0
          fi
          URL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
          if [ "$BUILD_STATUS" = "success" ]; then
            MSG="Pragma $TAG build succeeded — $URL"
            if [ "$PUBLISH_STATUS" = "success" ]; then
              MSG="$MSG (release published)"
            elif [ "$PUBLISH_STATUS" = "failure" ]; then
              MSG="$MSG — release publish FAILED, check the run"
            fi
          else
            MSG="Pragma $TAG build $BUILD_STATUS — $URL"
          fi
          if [[ "$NOTIFY_WEBHOOK_URL" == *ntfy.sh* ]]; then
            curl -fsS -H "Title: Pragma release build" -d "$MSG" "$NOTIFY_WEBHOOK_URL"
          else
            curl -fsS -H 'Content-Type: application/json' -d "{\"text\":\"$MSG\"}" "$NOTIFY_WEBHOOK_URL"
          fi
