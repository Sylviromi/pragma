name: Release

# Builds installable bundles for Linux (deb/rpm/AppImage), macOS (arm64 +
# x64) and Windows, then attaches them to a draft GitHub Release. Triggered by
# a version tag (see RELEASING.md for the full runbook).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Publish (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per architecture, HOST build (no --target): tauri derives
          # the bundle arch/names from the runner, so cross-compiling macOS on
          # an arm64 runner produced aarch64-named dmgs for the x64 job.
          - platform: macos-latest # Apple Silicon
          - platform: macos-13 # Intel
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install frontend dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - name: Build bundles and attach to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pragma v__VERSION__'
          releaseBody: |
            See the assets below to download and install this version.

            - **Linux**: use the `.deb` (Debian/Ubuntu) or `.AppImage` (any distro, no install needed)
            - **macOS**: use the `.dmg` / `.app` for your architecture (Apple Silicon or Intel)
            - **Windows**: use the `.msi` installer

            ## Changelog
            See [CHANGELOG.md](CHANGELOG.md) for this release.
          releaseDraft: true
          prerelease: false
