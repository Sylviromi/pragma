[package]
name = "pragma"
version = "0.1.0"
description = "Pragma — AI coding harness"
authors = ["Pragma"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pragma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "uuid", "macros"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
bytes = "1"
thiserror = "1"
notify = "6"
glob = "0.3"
walkdir = "2"
regex = "1"
diffy = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk-sys = "2.0"
cairo-sys-rs = { version = "0.18", features = ["png"] }
# expose the safe wrapper (already in the tree via wry) for widget downcasting
[target.'cfg(target_os = "linux")'.dependencies.webkit2gtk]
version = "2.0"
default-features = false
features = ["v2_40"]

[target.'cfg(target_os = "linux")'.dependencies.gio-sys]
version = "0.18"

[dev-dependencies]
tempfile = "3"
