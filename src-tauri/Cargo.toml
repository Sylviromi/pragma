[package]
name = "pragma"
version = "0.1.0"
description = "Pragma — AI coding harness"
authors = ["Pragma contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pragma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "uuid", "macros"] }
reqwest = { version = "0.12", features = ["stream", "json", "blocking"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
unicode-normalization = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
bytes = "1"
thiserror = "1"
notify = "6"
glob = "0.3"
walkdir = "2"
regex = "1"
# Plugin packaging: install/update plugins from .zip archives (deflate is the
# de-facto zip compression; stored entries always work).
zip = { version = "2", default-features = false, features = ["deflate"] }
# npm plugin sources: registry tarballs are gzipped tars (tar crate's unpack
# also guards against path traversal).
tar = "0.4"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
